<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhisperBox | Secure Messenger</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ======================================== -->
    <!-- AUTH SCREEN — Login & Register Forms    -->
    <!-- ======================================== -->
    <div id="auth-screen" class="screen active">
      <div class="auth-container">
        <!-- App Logo / Title -->
        <div class="auth-header">
          <div class="auth-icon">🔐</div>
          <h1>WhisperBox</h1>
          <p class="auth-subtitle">End-to-End Encrypted Messenger</p>
        </div>

        <!-- LOGIN FORM -->
        <form id="login-form" class="auth-form">
          <h2>Welcome Back</h2>

          <div class="input-group">
            <label for="login-username">Username</label>
            <input
              type="text"
              id="login-username"
              placeholder="Enter your username"
              autocomplete="username"
              required
            />
          </div>

          <div class="input-group">
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary">Log In</button>

          <p class="auth-switch">
            Don't have an account?
            <a href="#" id="show-register">Sign Up</a>
          </p>
        </form>

        <!-- REGISTER FORM -->
        <form id="register-form" class="auth-form hidden">
          <h2>Create Account</h2>

          <div class="input-group">
            <label for="register-username">Username</label>
            <input
              type="text"
              id="register-username"
              placeholder="Choose a username"
              autocomplete="username"
              required
            />
          </div>

          <div class="input-group">
            <label for="register-display-name">Display Name</label>
            <input
              type="text"
              id="register-display-name"
              placeholder="Your full name"
              autocomplete="name"
              required
            />
          </div>

          <div class="input-group">
            <label for="register-password">Password</label>
            <input
              type="password"
              id="register-password"
              placeholder="Create a strong password"
              autocomplete="new-password"
              required
              minlength="8"
            />
          </div>

          <button type="submit" class="btn btn-primary">Create Account</button>

          <p class="auth-switch">
            Already have an account?
            <a href="#" id="show-login">Log In</a>
          </p>
        </form>
      </div>
    </div>

    <!-- ======================================== -->
    <!-- CHAT SCREEN — Main Messaging Interface  -->
    <!-- ======================================== -->
    <div id="chat-screen" class="screen">
      <div class="chat-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
          <!-- Current User Info & Logout -->
          <div class="sidebar-header">
            <div class="current-user">
              <span class="user-avatar" id="current-user-avatar"></span>
              <span class="user-name" id="current-user-name"></span>
            </div>
            <button id="logout-btn" class="btn btn-icon" title="Logout">
              🚪
            </button>
          </div>

          <!-- Search Bar -->
          <div class="search-container">
            <input
              type="text"
              id="search-input"
              placeholder="Search users..."
              autocomplete="off"
            />
            <div id="search-results" class="search-results hidden"></div>
          </div>

          <!-- Conversations List -->
          <div class="conversations-list" id="conversations-list">
            <!-- Conversations will be inserted here by JavaScript -->
          </div>
        </aside>

        <!-- MAIN CHAT AREA -->
        <main class="chat-main">
          <!-- Chat Header -->
          <div class="chat-header" id="chat-header">
            <div class="chat-header-info">
              <span class="chat-header-name" id="chat-header-name">
                Select a conversation
              </span>
              <span
                class="encryption-badge"
                id="encryption-badge"
                style="display: none"
              >
                🔒 End-to-End Encrypted
              </span>
            </div>
          </div>

          <!-- Messages Area -->
          <div class="messages-container" id="messages-container">
            <div class="no-chat-selected" id="no-chat-selected">
              <div class="no-chat-icon">💬</div>
              <h3>Welcome to WhisperBox</h3>
              <p>
                Select a conversation or search for a user to start messaging
              </p>
            </div>
          </div>

          <!-- Message Input -->
          <div
            class="message-input-container"
            id="message-input-container"
            style="display: none"
          >
            <form id="message-form">
              <input
                type="text"
                id="message-input"
                placeholder="Type an encrypted message..."
                autocomplete="off"
                disabled
              />
              <button
                type="submit"
                id="send-btn"
                class="btn btn-primary"
                disabled
              >
                Send
              </button>
            </form>
          </div>
        </main>
      </div>
    </div>

    <!-- ======================================== -->
    <!-- JAVASCRIPT FILES — Loaded in Order      -->
    <!-- ======================================== -->

    <!-- Configuration (the address book) -->
    <script src="js/config.js"></script>

    <!-- Encryption (lockbox, envelope, and safe analogy) -->
    <script src="js/crypto.js"></script>

    <!-- Authentication (bridge to the server) -->
    <script src="js/auth.js"></script>

    <!-- WebSocket (bidirectional phone line) -->
    <script src="js/websocket.js"></script>

    <!-- Main App (UI logic and coordination) -->
    <script src="js/app.js"></script>
  </body>
</html>
